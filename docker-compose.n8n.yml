# n8n Process Execution Engine
# Usage: docker-compose -f docker-compose.n8n.yml up -d
#
# n8n runs alongside our NestJS API as the workflow execution layer.
# OpenClaw designs workflows → NestJS deploys to n8n via API → n8n executes with 400+ integrations.

version: '3.8'

services:
  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_secret
      POSTGRES_DB: n8n
    volumes:
      - n8n_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    ports:
      - '5678:5678'
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_secret
      # Security
      N8N_ENCRYPTION_KEY: neuron-os-n8n-fdc6a54e63c4c6a2c127ccb73fd4db90
      # API access (required for our NestJS orchestrator)
      N8N_API_ENABLED: 'true'
      # Webhook URL — our NestJS callback endpoint
      WEBHOOK_URL: http://host.docker.internal:3000
      # Execution settings
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
      # Disable diagnostics/insights (causes persistent errors in community edition)
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Allow Code nodes to make HTTP requests to external services
      NODE_FUNCTION_ALLOW_EXTERNAL: '*'
      N8N_RESTRICT_EXTERNAL_URLS: 'false'
      # Disable Task Runner sandbox (blocks HTTP from Code nodes in n8n 2.14+)
      N8N_RUNNERS_ENABLED: 'false'
      # Generic timezone
      GENERIC_TIMEZONE: Europe/Belgrade
      TZ: Europe/Belgrade
    volumes:
      - n8n_data:/home/node/.n8n
    # Allow n8n to reach host machine (our NestJS API for callbacks)
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  n8n_pg_data:
  n8n_data:
